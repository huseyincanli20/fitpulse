name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Flutter SDK Kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Paketleri İndir
        run: flutter pub get

      - name: iOS Build (Simulator / No-Codesign IPA)
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../../fitpulse.ipa Payload

      - name: IPA Dosyasını Artifact Olarak Paylaş
        uses: actions/upload-artifact@v4
        with:
          name: fitpulse-ios-ipa
          path: fitpulse.ipa
